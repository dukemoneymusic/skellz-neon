services:
  - type: web
    name: skellz-neon
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Set to 1 to make this service ping itself every 10 minutes so the free
      # plan never sleeps and the link is instant. Leave OFF unless this is the
      # one game you want always-on: Render gives an account 750 free
      # instance-hours a month and a single always-on service eats ~730 of
      # them, so two at once will suspend both. See src/server/keep-awake.ts.
      - key: KEEP_AWAKE
        value: "0"
    # IMPORTANT: room state lives in this process's memory (src/server/store.ts),
    # so the game must run as a SINGLE instance. The free plan is always one
    # instance, which is why nothing is pinned here — but if you ever move to a
    # paid plan, do not scale this past 1 or players will be routed to
    # instances that have never heard of their room. To scale out, move
    # src/server/store.ts to Redis or Postgres first.
